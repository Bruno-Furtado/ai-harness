<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">ai-harness</title>
  <desc id="desc">Tool agnostic agents, skills, commands, hooks and rules</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="28"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#059669" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="1160" cy="10" r="300" fill="url(#glowBlue)"/>
    <circle cx="90" cy="320" r="260" fill="url(#glowGreen)"/>
    <g stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
      <line x1="640" y1="86" x2="596" y2="54"/>
      <line x1="640" y1="86" x2="684" y2="54"/>
      <line x1="640" y1="86" x2="640" y2="134"/>
    </g>
    <circle cx="640" cy="86" r="11" fill="#f9fafb"/>
    <circle cx="596" cy="54" r="8" fill="#3b82f6"/>
    <circle cx="684" cy="54" r="8" fill="#10b981"/>
    <circle cx="640" cy="134" r="8" fill="#a78bfa"/>
    <!-- textLength locks the layout: the font resolves to whatever the reader
         has installed, and without it the text would shift the composition. -->
    <text id="wordmark" x="640" y="230" fill="#f9fafb" text-anchor="middle" textLength="470" lengthAdjust="spacingAndGlyphs" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI Variable Display, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="700">ai-harness</text>
    <text id="tags" x="640" y="272" fill="#94a3b8" text-anchor="middle" textLength="400" lengthAdjust="spacingAndGlyphs" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI Variable Display, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500">agents · skills · commands · hooks · rules</text>
  </g>
</svg>
