name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned

permissions:
  contents: read
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Require an assignee, a label and a milestone
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read the current state of the pull request, not the event payload.
          # The payload is a snapshot taken when the event fired, and `gh pr
          # create` sets assignee, labels and milestone in separate calls right
          # after opening. That fires several events at once, so the snapshot a
          # run receives can be missing a field that is already set by the time
          # the run executes. Asking the API removes the race.
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")

          assignees=$(jq '.assignees | length' <<<"$pr")
          labels=$(jq -r '[.labels[].name] | join(", ")' <<<"$pr")
          label_count=$(jq '.labels | length' <<<"$pr")
          milestone=$(jq -r '.milestone.title // ""' <<<"$pr")

          missing=0

          if [[ "$assignees" -eq 0 ]]; then
            echo "::error::This pull request has no assignee. Someone has to own it."
            missing=1
          fi

          if [[ "$label_count" -eq 0 ]]; then
            echo "::error::This pull request has no label. Release notes are grouped by label, so an unlabeled change lands under Other changes."
            missing=1
          fi

          if [[ -z "$milestone" ]]; then
            echo "::error::This pull request has no milestone. Set the version it targets."
            missing=1
          fi

          if [[ "$missing" -eq 1 ]]; then
            echo "See CONTRIBUTING.md for the triage rules."
            exit 1
          fi

          echo "assignees: $assignees"
          echo "labels: $labels"
          echo "milestone: $milestone"
