name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the commit range of the push or pull request, so it
          # needs the full history. The default shallow clone breaks it.
          fetch-depth: 0

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          # bash -n only parses its first argument, so check one file per call.
          for file in sync.sh hooks/*.sh docs/templates/hook.sh; do
            test -f "$file"
            bash -n "$file"
          done

      - name: Validate frontmatter
        shell: bash
        run: |
          set -euo pipefail
          for file in agents/*.md commands/*.md docs/templates/*.md; do
            test "$(awk 'NR == 1 { print; exit }' "$file")" = "---"
            test "$(awk 'BEGIN { found = 0 } NR > 1 && $0 == "---" { found = 1; exit } END { print found }' "$file")" = "1"
            grep -Eq '^description: .+' "$file"
          done
          for file in agents/*.md docs/templates/SKILL.md docs/templates/agent.md; do
            grep -Eq '^name: [a-z0-9]+(-[a-z0-9]+)*$' "$file"
          done

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
