name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: bash -n sync.sh hooks/*.sh docs/templates/hook.sh

      - name: Validate frontmatter
        shell: bash
        run: |
          set -euo pipefail
          for file in agents/*.md commands/*.md docs/templates/SKILL.md; do
            test "$(awk 'NR == 1 { print; exit }' "$file")" = "---"
            test "$(awk 'BEGIN { found = 0 } NR > 1 && $0 == "---" { found = 1; exit } END { print found }' "$file")" = "1"
            grep -Eq '^description: .+' "$file"
          done
          grep -Eq '^name: [a-z0-9]+(-[a-z0-9]+)*$' docs/templates/SKILL.md

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
