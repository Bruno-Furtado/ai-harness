name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the commit range of the push or pull request, so it
          # needs the full history. The default shallow clone breaks it.
          fetch-depth: 0

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          # bash -n only parses its first argument, so check one file per call.
          for file in hooks/*.sh docs/templates/hook.sh; do
            test -f "$file"
            bash -n "$file"
          done

      - name: Check python syntax
        shell: bash
        run: |
          set -euo pipefail
          # Skill scripts ship as source and run on whatever python3 the host
          # has, so a syntax error only shows up when someone runs the skill.
          python3 -m compileall -q ai_harness skills scripts
          python3 -m py_compile harness

      - name: Check the installer
        shell: bash
        run: |
          set -euo pipefail
          # A throwaway HOME, so the runner's own config is never touched. The
          # run is non interactive by design: no tty means no prompt, which is
          # also what makes the CLI usable from a script.
          export HOME
          HOME=$(mktemp -d)
          ./harness install --yes --dry-run < /dev/null
          ./harness install --yes --tools claude --artifacts skills
          ./harness check
          ./harness remove
          test -z "$(ls -A "$HOME/.claude/skills" 2>/dev/null)"

      - name: Check artifact naming
        shell: bash
        run: |
          set -euo pipefail
          kebab='^[a-z0-9]+(-[a-z0-9]+)*$'
          failures=0

          fail() { printf '%s\n' "$1" >&2; failures=1; }

          # The folder name is the skill name, per agentskills.io.
          for dir in skills/*/; do
            name=$(basename "$dir")
            [[ "$name" =~ $kebab ]] || fail "skill folder is not kebab-case: $name"
            grep -Fxq "name: $name" "$dir/SKILL.md" || fail "skills/$name/SKILL.md: name must be '$name'"
          done

          # An agent is <scope>-<role>. A bare role collides with tool built-ins.
          for file in agents/*.md; do
            name=$(basename "$file" .md)
            [[ "$name" =~ $kebab ]] || fail "agent file is not kebab-case: $name"
            [[ "$name" == *-* ]] || fail "agents/$name.md: needs a scope, '<scope>-<role>'"
            grep -Fxq "name: $name" "$file" || fail "agents/$name.md: name must be '$name'"
          done

          # A command is either the name of the skill it opens, or <verb>-<object>.
          for file in commands/*.md; do
            name=$(basename "$file" .md)
            [[ "$name" =~ $kebab ]] || fail "command file is not kebab-case: $name"
            if [[ ! -d "skills/$name" && "$name" != *-* ]]; then
              fail "commands/$name.md: name a skill, or use '<verb>-<object>'"
            fi
          done

          # ai_harness/ is out of this rule on purpose: a Python package name
          # cannot contain a hyphen, so the underscore is the language's call,
          # not a naming slip.
          for file in hooks/*.sh scripts/*.py rules/*.md; do
            name=$(basename "$file"); name=${name%.*}
            [[ "$name" =~ $kebab ]] || fail "file is not kebab-case: $file"
          done

          test "$failures" -eq 0

      - name: Check catalog is up to date
        shell: bash
        run: python3 scripts/build-catalog.py --check

      - name: Validate frontmatter
        shell: bash
        run: |
          set -euo pipefail
          for file in agents/*.md commands/*.md docs/templates/*.md; do
            test "$(awk 'NR == 1 { print; exit }' "$file")" = "---"
            test "$(awk 'BEGIN { found = 0 } NR > 1 && $0 == "---" { found = 1; exit } END { print found }' "$file")" = "1"
            grep -Eq '^description: .+' "$file"
          done
          for file in agents/*.md docs/templates/SKILL.md docs/templates/agent.md; do
            grep -Eq '^name: [a-z0-9]+(-[a-z0-9]+)*$' "$file"
          done

      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade build twine
          python3 -m build --wheel
          python3 -m twine check dist/*
          # The artifacts have to reach the wheel, or a pip install would give
          # someone a CLI with nothing to install.
          python3 -m zipfile -l dist/*.whl | grep -q "ai_harness/_artifacts/targets.json"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
